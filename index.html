<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Aira - Cabin Crew Avatar Agent</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #555;
    }

    .avatar-container {
      width: 100%;
      min-height: 400px;
      background: #eef1f5;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .avatar-placeholder {
      color: #777;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Aira</h1>

    <p class="subtitle">
      AirAsia Virtual Cabin Crew
    </p>

    <!-- Avatar area -->
    <div
      id="avatar-container"
      class="avatar-container"
      data-avatar-id="1f8f6a1f-9608-4ba3-a335-9d22ec4a36c7"
    >
      <p class="avatar-placeholder">
        Avatar will appear here once the Avatar API/SDK is connected.
      </p>
    </div>

    <!-- ElevenLabs Conversational AI Agent -->
    <elevenlabs-convai
      agent-id="agent_4901kvey5tfhf0ab5xw9x5f3n5g7">
    </elevenlabs-convai>

  </main>

  <!-- ElevenLabs Widget -->
  <script
    src="https://unpkg.com/@elevenlabs/convai-widget-embed"
    async
    type="text/javascript">
  </script>

</body>
</html>
